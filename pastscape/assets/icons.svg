<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true" id="ps-sprite">
<!--
  Pastscape icon set.
  Original-drawn shapes in the spirit of the Netscape Communicator 4 toolbar:
  saturated green arrows with a hard drop shadow, cream envelopes with a blue
  flap, manila folders. 24x24 grid, chunky edges, no anti-aliased subtlety.
-->
<defs>
  <linearGradient id="psSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#000033"/>
    <stop offset="1" stop-color="#0a0a5a"/>
  </linearGradient>
  <linearGradient id="psTitle" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#000080"/>
    <stop offset="1" stop-color="#1084d0"/>
  </linearGradient>
</defs>

<!-- ================= mail toolbar ================= -->

<symbol id="ic-getmsg" viewBox="0 0 24 24">
