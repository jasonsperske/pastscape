  <path d="M11 1h3v7h4l-5.5 6L7 8h4z" fill="#00a800" stroke="#004d00" stroke-width="1" stroke-linejoin="round"/>
  <path d="M14 8h4l-5.5 6z" fill="#006e00"/>
</symbol>

