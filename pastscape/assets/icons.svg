  <path d="M10 1v3h4a6 6 0 0 1 6 6v1h-3v-1a3 3 0 0 0-3-3h-4v3L4 5.5z" fill="#00a800" stroke="#004d00" stroke-width="1" stroke-linejoin="round"/>
